<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第一幕｜牡丹車站的舊月台之戀</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#03060f;color:#fff;overflow-x:hidden}
body{font-family:"DFKai-SB","標楷體","BiauKai","Kaiti TC","KaiTi","STKaiti",serif;font-size:clamp(24px,6.4vw,32px);line-height:1.8}
.bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(#070d20,#02040a)}
.bg:before,.bg:after{content:"";position:absolute;inset:-20%;animation:dr 16s ease-in-out infinite alternate}
.bg:before{background:radial-gradient(ellipse at 25% 20%,rgba(90,130,230,.38),transparent 55%)}
.bg:after{background:radial-gradient(ellipse at 80% 82%,rgba(214,160,80,.2),transparent 50%);animation-duration:21s;animation-direction:alternate-reverse}
@keyframes dr{to{transform:translate(8%,6%) scale(1.15)}}
.vg{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 170px rgba(0,0,0,.75);z-index:1}
#st{min-height:100dvh;padding:calc(60px + env(safe-area-inset-top,0px)) 24px 130px;max-width:520px;margin:0 auto;transition:opacity .55s}
#st.off{opacity:0}
.tx{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:calc(100dvh - 200px - env(safe-area-inset-top,0px))}
.ln{display:block;margin:.3em 0;opacity:0;filter:blur(7px);transform:translateY(16px);transition:opacity 1.7s ease,filter 1.7s ease,transform 1.7s ease;text-shadow:0 0 18px rgba(130,165,255,.45)}
.ln.on{opacity:1;filter:none;transform:none}
.ttl .ln{font-size:1.2em;letter-spacing:.12em}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none;padding:20px 22px calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end}
.go{font:inherit;color:#fff;background:none;border:0;padding:12px 6px;min-height:56px;letter-spacing:.1em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1.2s}
.go.show{opacity:1;pointer-events:auto;animation:br 2.6s ease-in-out infinite}
.go:active,.go.show:active{opacity:.6}
@keyframes br{50%{filter:brightness(1.18)}}
.qw{display:flex;flex-direction:column;gap:22px}
.no{font-size:.8em;color:#a9b8e6;letter-spacing:.2em}
.qb{border-left:5px solid #fff;padding:4px 0 4px 16px;width:94%;font-weight:700;text-shadow:0 0 18px rgba(130,165,255,.4)}
.op{font:inherit;color:#fff;background:none;border:0;border-radius:0;padding:14px 4px;min-height:64px;width:100%;text-align:left;line-height:1.5;cursor:pointer;transition:transform .08s;opacity:0;animation:rise .9s ease forwards}
.op:active:not(:disabled){transform:translateX(8px);text-shadow:0 0 16px rgba(160,190,255,.9)}
.op b{margin-right:.5em}
.o0{animation-delay:.3s}
.o1{animation-delay:.7s}
.o2{animation-delay:1.1s}
@keyframes rise{to{opacity:1}}
.op:disabled{cursor:default}
.op:disabled:not(.ok):not(.bad){animation:none;opacity:.45}
.op.ok{color:#8dffb8;text-shadow:0 0 22px rgba(90,220,140,.8)}
.op.bad{color:#ff9c9c;animation:sh .5s forwards}
@keyframes sh{0%{opacity:1}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}100%{opacity:1}}
.fbk{opacity:0;transition:opacity 1.5s;margin-top:6px}.fbk.on{opacity:1}
@media (prefers-reduced-motion:reduce){.ln,#st{transition-duration:.01s}.bg:before,.bg:after{animation:none}}
</style></head><body><div class="bg"></div><div class="vg"></div><div id="st"></div>
<script>
var F=document.getElementById("st"),tk=0,tm,p=0,score=0,
/* 劇情頁：ps=逐行文字；auto=毫秒，到時自動淡出；b=按鈕文字（預設「下一頁」） */
P=[{ttl:1,ps:["第一幕","牡丹車站的舊月台之戀"]},
{ps:["前世","我為了愛情放棄了一切","最後卻被最好的閨密和未婚夫聯手背叛"],auto:10000},
{ps:["一場意外後","我竟重生回到命運的起點","——牡丹車站"]},
{ps:["看著熟悉的月台","我突然想起","前世的未婚夫曾在這裡對我許下承諾"],auto:10000},
{ps:["但這一次","我不會再被甜言蜜語欺騙"],auto:10000},
{ps:["我決定從這座車站開始，尋找一切的真相"]},
{ps:["牡丹車站究竟藏著什麼祕密？","一切就從眼前的鐵道開始！"],b:"開始答題"}],
/* 題目：[題幹,[選項],正確答案編號(0=A)] */
QS=[["牡丹車站最著名的鐵道特色是什麼？",["120度的大彎道","全台最長的直線月台","可以讓火車原地旋轉的月台"],0],
["當年為了讓較寬的普悠瑪列車安全通過彎道，傳聞中台鐵做了什麼調整？",["把整座車站搬走","修整第二月台邊緣","把列車車廂全部縮短"],1],
["早期列車爬坡吃力時，可能需要什麼協助？",["乘客一起下車推車","另一台輔助機車幫忙推拉","把火車改成公車"],1],
["牡丹車站早期特殊的折返式設計，主要與什麼有關？",["山坡地形與鐵路坡度","方便火車繞過海洋","為了讓火車每天轉圈"],0],
["牡丹車站曾因乘客減少而調整站務等級，後來又恢復簡易站。這象徵什麼？",["車站從此永遠關閉","地方居民的需求也能影響車站服務","所有列車都不再停靠"],1]];
QS.forEach(function(q,i){P.push({k:"q",q:q,n:i})});P.push({fin:1});
/* 依標點斷句，依句尾標點決定停頓長短 */
function mk(ps){var out=[];ps.forEach(function(t){var pc=[];
(t.match(/[^。！？；]+[。！？；]*[」』]?/g)||[t]).forEach(function(x){
if(x.length>18){var c="";(x.match(/[^，、]+[，、]?/g)||[x]).forEach(function(y){if(c&&(c+y).length>18){pc.push(c);c=y}else c+=y});if(c)pc.push(c)}else pc.push(x)});
pc.forEach(function(x,i){var ch=x.replace(/[」』]/g,"").slice(-1),d=({"。":1500,"！":1300,"？":1800,"；":1200,"，":850,"、":750,"…":1900,"—":1900})[ch]||1000;
d+=x.length*45;if(i==pc.length-1)d+=800;out.push({s:x,d:d})})});return out}
function nx(){if(p<P.length-1)show(p+1)}
function show(n){tk++;clearTimeout(tm);F.classList.add("off");setTimeout(function(){p=n;window.scrollTo(0,0);P[n].k=="q"?Q(P[n]):T(P[n]);F.classList.remove("off")},600)}
function dock(b){return '<div class="dock"><button class="go" id="go" onclick="this.disabled=true;nx()">◎'+b+"</button></div>"}
function btn(d){setTimeout(function(){var g=document.getElementById("go");if(g)g.classList.add("show")},d)}
function T(s){var ps=s.ps;if(s.fin)ps=["牡丹篇完結","你答對了 "+score/10+" 題，共 "+score+" 分","——真正的幕後黑手，竟然就在雙溪！"];
var L=mk(ps),my=tk,t0=Date.now();
F.innerHTML='<div class="tx'+(s.ttl?" ttl":"")+'" id="tx">'+L.map(function(l){return '<span class="ln">'+l.s+"</span>"}).join("")+"</div>"+(s.auto||s.fin?"":dock(s.b||"下一頁"));
var E=F.querySelectorAll(".ln");
function run(i){if(my!=tk)return;if(i>=E.length){if(s.auto)tm=setTimeout(function(){if(my==tk)show(p+1)},Math.max(1500,s.auto-(Date.now()-t0)));else btn(700);return}E[i].classList.add("on");tm=setTimeout(function(){run(i+1)},L[i].d)}
if(!s.auto)document.getElementById("tx").onclick=function(){clearTimeout(tm);E.forEach(function(e){e.classList.add("on")});btn(500)};
run(0)}
function Q(s){var q=s.q,last=s.n==QS.length-1;
F.innerHTML='<div class="qw"><div class="no">第'+"一二三四五"[s.n]+'題</div><div class="qb">'+q[0]+"</div>"+q[1].map(function(o,k){return '<button class="op o'+k+'" data-k="'+k+'"><b>'+"ABC"[k]+".</b>"+o+"</button>"}).join("")+'<div class="fbk" id="fb"></div></div>'+dock(last?"看結果":"下一題");
F.querySelectorAll(".op").forEach(function(b){b.onclick=function(){var k=+b.dataset.k,r=k==q[2],bs=F.querySelectorAll(".op"),f=document.getElementById("fb");
bs.forEach(function(y){y.disabled=true});bs[q[2]].classList.add("ok");if(!r)b.classList.add("bad");if(r)score+=10;
f.textContent=r?"答對了！+10 分。真相解鎖！妳終於拿回一部分命運！":"答錯了。正確答案是 "+"ABC"[q[2]]+"。什麼！這竟然和前世的記憶不一樣！";
setTimeout(function()
{f.classList.add("on");f.scrollIntoView({behavior:"smooth",block:"center"})},600);btn(2200)}})}
show(0);
</script></body></html>
